<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>儿童音乐魔法衣服</title>
  <style>
    body {
      font-family: "Comic Sans MS", "幼圆", sans-serif;
      text-align: center;
      background: #fff7e6;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #ff6600;
      font-size: 24px;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 400px;
      margin: auto;
    }
    .btn {
      background: #ffcc66;
      border: 2px solid #ff9933;
      border-radius: 15px;
      padding: 15px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
      transition: all 0.2s;
    }
    .btn.playing {
      background: #ff9966;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>🎵 跟着小韩唱歌 🎵</h1>

  <div class="grid">
    <button class="btn" data-song="astronaut">🚀 宇航员</button>
    <button class="btn" data-song="sun">☀️ 小太阳</button>
    <button class="btn" data-song="cat">🐱 可爱猫咪</button>
    <button class="btn" data-song="robot">🤖 机器人</button>
    <button class="btn" data-song="spaceship">🛸 宇宙飞船</button>
    <button class="btn" data-song="sleep">🌙 晚安</button>
  </div>

  <audio id="player"></audio>

  <script>
    const player = document.getElementById("player");

    // 这里替换成你的 GitHub Pages 地址
    const baseURL = "https://ryan-lele.github.io/music1/";


    const songs = {
      astronaut: baseURL + "1.mp3",
      sun: baseURL + "1.mp3",
      cat: baseURL + "1.mp3",
      robot: baseURL + "spaceman.mp3",
      spaceship: baseURL + "spaceman.mp3",
      sleep: baseURL + "spaceman.mp3"
    };

    let currentBtn = null;

    document.querySelectorAll(".btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const song = songs[btn.dataset.song];

        if (currentBtn === btn && !player.paused) {
          // 暂停
          player.pause();
          btn.classList.remove("playing");
        } else if (currentBtn === btn && player.paused) {
          // 继续播放
          player.play();
          btn.classList.add("playing");
        } else {
          // 切换歌曲
          if (currentBtn) currentBtn.classList.remove("playing");
          player.src = song;
          player.currentTime = 0;
          player.play();
          btn.classList.add("playing");
          currentBtn = btn;
        }
      });
    });

    player.addEventListener("ended", () => {
      if (currentBtn) currentBtn.classList.remove("playing");
    });
  </script>
</body>
</html>
